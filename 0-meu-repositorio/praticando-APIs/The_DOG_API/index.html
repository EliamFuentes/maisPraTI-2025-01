<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>The Dog API</title>
  </head>
  <body>
    <header class="header">
      <h1 class="title-header">Cachorro - o melhor amigo do homem</h1>
    </header>
    <main>
      <section class="escolher">
        <div class="escolher-div">
          <h2 class="title-mes">Qual cachorro você seria segundo o seu mês:</h2>
          <button id="btn-escolher-cachorro" type="button" class="btn-escolher">
            Escolher
          </button>
          <div id="imagem">
            <figure class="imagem-mostrar">
              <img id="imagem-cachorro" src="" alt="Imagem do cachorro" />
              <figcaption id="mes"></figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
